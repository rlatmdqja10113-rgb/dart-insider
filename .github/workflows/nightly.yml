# GitHub Actions 로 매일 아침 돌리는 설정. 내 컴퓨터가 꺼져 있어도 GitHub 서버에서 돈다. 무료.
#
# 준비물: 저장소 Settings → Secrets and variables → Actions → New repository secret
#   DART_API_KEY (필수), TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (무료 채널),
#   TELEGRAM_PAID_CHAT_ID (유료 채널, 선택), SMTP_* (이메일, 선택)
#
# 매 실행: 최신 코드·DB 받기 → DART 수집 → 아직 안 보낸 공시만 텔레그램 발송 → DB 를 저장소에 저장
#   - 같은 날 여러 번 돌려도(수동 실행, Re-run) 이미 보낸 공시는 다시 보내지 않는다.
#   - 발송이 실패하면 빨간 X 로 끝나고, 다음 실행이 그 공시를 다시 보낸다.
#
# (선택) 아카이브 사이트: Settings → Pages → Source 를 "GitHub Actions" 로 바꾸고,
#   Settings → Secrets and variables → Actions → Variables 에 ENABLE_PAGES = true 를 추가.
#   비공개 저장소는 무료 요금제에서 Pages 를 쓸 수 없다.
name: nightly-insider-report

on:
  schedule:
    # UTC 기준. 한국 시간 07:10 = 전날 UTC 22:10. 일~목 UTC 밤 = 월~금 KST 아침.
    - cron: "10 22 * * 0-4"
  workflow_dispatch:   # Actions 탭에서 "Run workflow" 버튼으로 수동 실행

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # ref: main → Re-run 을 눌러도 옛 스냅샷이 아니라 지금의 최신 코드·DB 에서 시작한다.
      # (옛 스냅샷에서 시작하면 마지막에 DB 저장이 거부된다)
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 수집·발송
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PAID_CHAT_ID: ${{ secrets.TELEGRAM_PAID_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SITE_TITLE: ${{ vars.SITE_TITLE }}
          SITE_TAGLINE: ${{ vars.SITE_TAGLINE }}
          SITE_SUBSCRIBE_URL: ${{ vars.SITE_SUBSCRIBE_URL }}
          SITE_BASE_PATH: /${{ github.event.repository.name }}
        run: python -m insider run

      # 발송이 실패해도 DB 는 저장한다 (새로 받은 공시, '아직 안 보냄' 상태를 다음 실행이 이어받도록).
      - name: DB 저장 (다음 실행이 이어받도록)
        if: ${{ !cancelled() }}
        run: |
          git config user.name "insider-bot"
          git config user.email "insider-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "저장할 변경 없음"; exit 0; fi
          git commit -q -m "data: $(date +%F)"
          # 실행 도중 다른 커밋(코드 수정 등)이 올라왔으면 그 위로 옮겨서 저장. 겹치면 방금 만든 DB 를 쓴다.
          for i in 1 2 3; do
            if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then
              echo "저장 완료"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "저장 재시도 $i/3"; sleep $((i * 5))
          done
          echo "::error::DB 저장 실패. 다음 실행 때 같은 공시가 다시 발송될 수 있습니다."
          exit 1

      - uses: actions/upload-pages-artifact@v4
        if: ${{ vars.ENABLE_PAGES == 'true' }}
        with:
          path: site

  # 아카이브 사이트 게시 (선택). ENABLE_PAGES 변수가 없으면 건너뛴다.
  deploy:
    needs: run
    if: ${{ vars.ENABLE_PAGES == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
